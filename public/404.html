<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Arroudhil Anfi - Portofolio</title>
    <script type="text/javascript">
        // SPA fallback for BrowserRouter on GitHub Pages.
        // Primary fix: CI copies dist/index.html -> dist/404.html after build,
        // so Pages serves the app directly on /projects/:id refresh.
        // This file is the secondary fallback (manual builds without that copy):
        // redirect to /#/path so App.jsx <HashRedirect/> can restore the route.
        (function () {
            var pathname = window.location.pathname;
            var search = window.location.search;
            var hash = window.location.hash;
            // Avoid loop when already a hash route
            if (hash && hash.indexOf('#/') === 0) return;
            var cleanPath = pathname.replace(/\/(404\.html|404)\/?$/, '') || '/';
            var segments = cleanPath.split('/').filter(Boolean);
            var base = '/';
            if (window.location.hostname.endsWith('.github.io') && segments.length > 0) {
                var knownRoutes = ['about', 'projects', 'services', 'experience', 'school-projects', 'achievements', 'contact', 'admin'];
                if (knownRoutes.indexOf(segments[0]) === -1 && segments.length >= 1) {
                    base = '/' + segments[0] + '/';
                    cleanPath = '/' + segments.slice(1).join('/');
                    if (cleanPath === '/') cleanPath = '';
                }
            }
            var path = cleanPath.charAt(0) === '/' ? cleanPath : '/' + cleanPath;
            if (path === '/' && !search) return; // already home, avoid loop
            var target = base + '#' + path + search;
            window.location.replace(target);
        })();
    </script>
</head>

<body>
    Redirecting...
</body>

</html>
